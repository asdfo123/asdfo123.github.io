name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Daily rebuild so CV updates in asdfo123/asdfo123 reach the site
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Falls back to the committed copy if the fetch fails
      - name: Fetch latest CV
        run: |
          curl -fsSL -o /tmp/cv.pdf https://raw.githubusercontent.com/asdfo123/asdfo123/main/CV_Xinye_Li.pdf \
            && mv /tmp/cv.pdf public/CV_Xinye_Li.pdf \
            || echo "CV fetch failed; using committed copy"

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
